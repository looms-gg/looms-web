<!doctype html>
<html lang="en" data-theme="looms">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131418" />
    <title>looms — Minecraft clothing for skins</title>
    <script>
      try {
        var theme = localStorage.getItem("looms.theme") || localStorage.getItem("skinplex.theme")
        if (theme === "looms-light" || theme === "skinplex-light") {
          document.documentElement.setAttribute("data-theme", "looms-light")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f1f8")
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
