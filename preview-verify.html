<!doctype html>
<html lang="en" data-theme="looms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Preview — VerifyEmailModal</title>
    <script>
      try {
        var theme = localStorage.getItem("looms.theme") || localStorage.getItem("skinplex.theme")
        if (theme === "looms-light" || theme === "skinplex-light") {
          document.documentElement.setAttribute("data-theme", "looms-light")
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview-verify.tsx"></script>
  </body>
</html>
