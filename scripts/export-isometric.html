<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Export Isometric Renders</title>
  </head>
  <body style="background: #131418; color: #fff; font-family: sans-serif; padding: 20px;">
    <h2>Looms Isometric Exporter</h2>
    <div id="status">Initializing...</div>
    <div id="preview" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;"></div>

    <script type="module">
      import { isoPieceThumb } from "/src/skin/iso.ts"
      import catalogSeed from "/src/data/catalog-seed.json"

      const status = document.getElementById("status")
      const preview = document.getElementById("preview")

      const PUBLIC_BASE = "https://pcybqblxszemklcxunuz.supabase.co/storage/v1/object/public/garments/45e6be54-c9a5-4627-af39-9c14b27ec92e"

      async function run() {
        console.log(`[ISO] Starting render for ${catalogSeed.length} pieces...`)
        const results = {}

        for (let i = 0; i < catalogSeed.length; i++) {
          const row = catalogSeed[i]
          const piece = {
            id: row.id,
            name: row.name,
            slot: row.slot,
            group: row.group,
            maker: "ser0th",
            savedCount: row.saved_count,
            likeCount: 0,
            added: row.added,
            blurb: row.blurb,
            skin: `${PUBLIC_BASE}/${row.id}.png`,
            covers: row.covers,
          }

          console.log(`[ISO] Rendering (${i + 1}/${catalogSeed.length}): ${piece.id}`)
          try {
            // bakeFx=false: the server stores fx-less PNGs; the app bakes
            // shadow+rim at runtime (skin/thumbFx) so tiles stay one image.
            const res = await isoPieceThumb(piece, "classic", true, false)
            results[piece.id] = { url: res.url, wash: res.wash }

            const img = document.createElement("img")
            img.src = res.url
            img.title = piece.name
            img.style.width = "96px"
            img.style.height = "96px"
            img.style.background = res.wash || "#201a30"
            img.style.borderRadius = "12px"
            preview.appendChild(img)
          } catch (e) {
            console.error(`[ISO] Error rendering ${piece.id}:`, e)
          }
        }

        console.log(`[ISO] Rendering featured outfit...`)
        try {
          const featuredLookPieces = [
            catalogSeed.find((p) => p.id === "winter-coat"),
            catalogSeed.find((p) => p.id === "dark-sweatpants"),
            catalogSeed.find((p) => p.id === "knee-high-converse"),
            catalogSeed.find((p) => p.id === "ink-fall"),
          ]
            .filter(Boolean)
            .map((row) => ({
              id: row.id,
              name: row.name,
              slot: row.slot,
              group: row.group,
              maker: "ser0th",
              savedCount: row.saved_count,
              likeCount: 0,
              added: row.added,
              blurb: row.blurb,
              skin: `${PUBLIC_BASE}/${row.id}.png`,
              covers: row.covers,
            }))

          const { isoOutfitThumb } = await import("/src/skin/iso.ts")
          const res = await isoOutfitThumb(featuredLookPieces, "body-4", 0, "classic", true, false)
          results["__featured_outfit"] = { url: res.url, wash: res.wash }
        } catch (e) {
          console.error("[ISO] Error rendering featured outfit:", e)
        }

        console.log(`[ISO] Sending ${Object.keys(results).length} renders to server...`)
        const res = await fetch("/api/save-iso-renders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(results),
        })

        if (res.ok) {
          console.log("[ISO] SUCCESS! Saved all isometric renders.")
          status.textContent = "All isometric renders saved successfully!"
          document.body.setAttribute("data-done", "true")
        } else {
          console.error("[ISO] Failed to save:", await res.text())
        }
      }

      run()
    </script>
  </body>
</html>
