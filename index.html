<!doctype html>
<html lang="en" data-theme="looms">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b482ff" />
    <title>looms — Minecraft clothing for skins</title>
    <meta
      name="description"
      content="Mix and match modular Minecraft clothing, hair, and accessories into custom skins in 3D. Free to style, export, and wear."
    />

    <!-- Open Graph / Discord / Facebook -->
    <meta property="og:site_name" content="looms" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="looms — Minecraft clothing for skins" />
    <meta
      property="og:description"
      content="Mix and match modular Minecraft clothing, hair, and accessories into custom skins in 3D. Free to style, export, and wear."
    />
    <meta property="og:url" content="https://looms.gg/" />
    <meta property="og:image" content="https://looms.gg/og/outfit-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="looms — Minecraft clothing for skins" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="looms — Minecraft clothing for skins" />
    <meta
      name="twitter:description"
      content="Mix and match modular Minecraft clothing, hair, and accessories into custom skins in 3D. Free to style, export, and wear."
    />
    <meta name="twitter:image" content="https://looms.gg/og/outfit-default.png" />

    <script>
      try {
        var theme = localStorage.getItem("looms.theme") || localStorage.getItem("skinplex.theme")
        if (theme === "looms-light" || theme === "skinplex-light") {
          document.documentElement.setAttribute("data-theme", "looms-light")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f1f8")
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
